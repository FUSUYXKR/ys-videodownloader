<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>X Video Downloader</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1115;color:#f4f4f5;font-family:system-ui,sans-serif}
.card{width:min(620px,calc(100% - 28px));padding:30px;border:1px solid #282c35;border-radius:22px;background:#171a20}
h1{margin:0}.logo{font-size:34px}p{color:#a7adb9;line-height:1.5}
.row{display:flex;gap:10px;margin-top:22px}
input{flex:1;min-width:0;padding:15px;border-radius:12px;border:1px solid #3a3f49;background:#0d0f13;color:#fff;font-size:16px}
button{padding:15px 20px;border:0;border-radius:12px;background:#fff;color:#111;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}@media(max-width:560px){.row{flex-direction:column}button{width:100%}}
</style></head>
<body><main class="card">
<div class="logo">🎬</div><h1>X Video Downloader</h1>
<p>Herkese açık X gönderilerindeki videoları indirmek için bağlantıyı yapıştır.</p>
<form id="form"><div class="row">
<input id="url" type="url" placeholder="https://x.com/.../status/..." required>
<button id="btn">İndir</button></div></form>
<div id="status"></div>
<p style="font-size:13px;color:#777e8b">X hesabı veya şifre istemez.</p>
</main>
<script>
const f=document.querySelector('#form'),u=document.querySelector('#url'),b=document.querySelector('#btn'),s=document.querySelector('#status');
f.onsubmit=async e=>{e.preventDefault();let x=u.value.trim();
if(!/^https?:\/\/(www\.)?(x\.com|twitter\.com)\//i.test(x)){s.textContent='Geçerli bir X bağlantısı gir.';return}
b.disabled=true;s.textContent='Video hazırlanıyor…';
try{let r=await fetch('/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:x})});
if(!r.ok)throw Error(await r.text());let blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='x-video.mp4';a.click();URL.revokeObjectURL(a.href);s.textContent='İndirme başladı.'
}catch(e){s.textContent='İndirme başarısız: '+e.message}finally{b.disabled=false}};
</script></body></html>
